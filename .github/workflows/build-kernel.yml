name: Build Kernel

on:
  workflow_dispatch:
      branch:
        - main

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Jakarta
      KBUILD_BUILD_USER: v
      KBUILD_BUILD_HOST: paradise 

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Cache Clang
        uses: actions/cache@main
        with:
          path: tc
          key: clang-r536225

      - name: Setup Clang
        run: |
          if [ ! -f "tc/bin/clang" ]; then
            echo "Cloning clang later"
          else
            echo "Using cached clang"
          fi

      - name: Setup kernelsu
        run: |
          curl -LSs "https://raw.githubusercontent.com/xvergilantte/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy

      - name: Record build start time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Building & save log
        continue-on-error: true
        run: |
          source build.sh
          echo "ZIPNAME=${ZIPNAME}" >> $GITHUB_ENV
          echo "LOGNAME=build.log" >> $GITHUB_ENV
                
      - name: Upload build & log artifact
        uses: actions/upload-artifact@main
        continue-on-error: true
        with:
          name: build-artifact
          path: |
            ${{ env.ZIPNAME }}
            ${{ env.LOGNAME }}

      - name: Calculate build script duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - BUILD_START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          echo "BUILD_DURATION=${MINUTES}m ${SECONDS}s" >> $GITHUB_ENV

      - name: Create caption
        run: |
          BUILD_DATE="$(date '+%H:%M | %d/%m/%Y')"
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          BRANCHNAME="$GITHUB_REF_NAME"
          RUNNUMBER="${{ github.run_number }}"
          COMMIT_HASH=$(git rev-parse HEAD)
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/$COMMIT_HASH"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
          echo "${BUILD_DATE}"
          echo "${{ env.BUILD_DURATION }}"
          echo "${COMMIT_HASH:0:8}"
          echo "Branch : ${BRANCHNAME}"
          echo "#${RUNNUMBER}"
          echo '```'
          echo "${COMMIT_MESSAGE}"
          echo '```'
          echo "[Commit](${COMMIT_URL})"
          echo "[Workflow run](${RUN_URL})"
          } > caption.txt

      - name: Upload log and kernel to Telegram
        run: |
          LOG=$(ls build.log)
          STANDARD=$(ls Perf-surya-*.zip)
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
          -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -F document=@"${LOG}"
          caption=$(<caption.txt)
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
          -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -F document=@"${STANDARD}" \
          -F parse_mode="Markdown" \
          -F caption="${caption}"
